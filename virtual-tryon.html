<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>StyleIQ - Virtual Try-On</title>

  <link rel="stylesheet" href="css/style.css">


  <style>

    /* =========================================
       MAIN VIRTUAL TRY-ON LAYOUT
       ========================================= */

    .tryon-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;

      width: 90%;
      max-width: 1200px;

      margin: 40px auto;

      align-items: start;
    }


    /* =========================================
       LEFT AND RIGHT PANELS
       ========================================= */

    .tryon-panel,
    .clothing-panel {

      background: #fff;

      border-radius: 16px;

      padding: 30px;

      box-shadow:
        0 4px 20px rgba(0, 0, 0, 0.08);

      min-height: 400px;
    }


    /* =========================================
       VIRTUAL TRY-ON
       ========================================= */

    .tryon-title {

      text-align: center;

      margin-bottom: 10px;
    }


    .tryon-subtitle {

      text-align: center;

      color: #666;

      margin-bottom: 30px;
    }


    .camera-area {

      text-align: center;
    }


    #cameraVideo,
    #capturedImage {

      width: 100%;

      max-width: 500px;

      border-radius: 12px;

      background: #111;

      display: none;

      margin: 0 auto 20px;
    }


    #cameraVideo {

      transform: scaleX(-1);
    }


    /* =========================================
       BUTTONS
       ========================================= */

    .button-group {

      display: flex;

      justify-content: center;

      gap: 12px;

      flex-wrap: wrap;

      margin: 20px 0;
    }


    .tryon-btn {

      padding: 12px 22px;

      border: none;

      border-radius: 8px;

      cursor: pointer;

      font-size: 15px;

      font-weight: 600;
    }


    .primary-btn {

      background: #111;

      color: white;
    }


    .secondary-btn {

      background: #eee;

      color: #111;
    }


    .danger-btn {

      background: #d9534f;

      color: white;
    }


    .upload-label {

      display: inline-block;

      padding: 12px 22px;

      border-radius: 8px;

      background: #eee;

      cursor: pointer;

      font-weight: 600;
    }


    #imageInput {

      display: none;
    }


    .status {

      text-align: center;

      margin-top: 20px;

      color: #555;

      min-height: 24px;
    }


    .next-section {

      display: none;

      margin-top: 30px;

      padding-top: 25px;

      border-top: 1px solid #ddd;

      text-align: center;
    }


    /* =========================================
       SELECT CLOTHING
       ========================================= */

    .clothing-panel h2 {

      text-align: center;

      margin-top: 0;

      margin-bottom: 20px;
    }


    #categoryMessage {

      text-align: center;

      color: #555;

      margin-bottom: 20px;
    }


    #categoryButtons {

      display: flex;

      flex-direction: column;

      gap: 10px;
    }


    #categoryButtons button {

      width: 100%;

      padding: 13px 16px;

      text-align: left;

      cursor: pointer;

      border-radius: 8px;

      border: 1px solid #ddd;

      background: #f7f7f7;

      font-size: 15px;

      transition: 0.2s;
    }


    #categoryButtons button:hover {

      background: #eeeeee;
    }


    /* =========================================
       PRODUCT LIST
       ========================================= */

    #productList {

      margin-top: 25px;

      display: grid;

      grid-template-columns: 1fr;

      gap: 20px;
    }


    .tryon-product-card {

      border: 1px solid #ddd;

      border-radius: 12px;

      padding: 15px;

      background: #fafafa;

      text-align: center;
    }


    .tryon-product-card img {

      width: 100%;

      max-width: 200px;

      height: 220px;

      object-fit: contain;

      border-radius: 8px;

      margin-bottom: 10px;
    }


    .tryon-product-card h3 {

      margin: 8px 0;

      font-size: 18px;
    }


    .tryon-product-card p {

      margin: 6px 0;

      color: #555;

      font-size: 14px;
    }


    .select-product-btn {

      margin-top: 12px;

      padding: 10px 18px;

      border: none;

      border-radius: 8px;

      background: #111;

      color: white;

      cursor: pointer;

      font-weight: 600;
    }


    .select-product-btn:hover {

      opacity: 0.85;
    }


    /* =========================================
       MOBILE
       ========================================= */

    @media (max-width: 768px) {

      .tryon-layout {

        grid-template-columns: 1fr;

        width: 95%;

        margin: 20px auto;
      }


      .tryon-panel,
      .clothing-panel {

        padding: 20px;
      }

    }

  </style>

</head>


<body>


  <!-- =========================================
       MAIN TWO-PANEL LAYOUT
       ========================================= -->

  <div class="tryon-layout">


    <!-- =======================================
         LEFT PANEL - VIRTUAL TRY-ON
         ======================================= -->

    <div class="tryon-panel">


      <h1 class="tryon-title">
        Virtual Try-On
      </h1>


      <p class="tryon-subtitle">
        Capture your photo using the camera
        or upload an image.
      </p>


      <div class="camera-area">


        <!-- Camera -->

        <video
          id="cameraVideo"
          autoplay
          playsinline
        ></video>


        <!-- Canvas -->

        <canvas
          id="cameraCanvas"
          style="display:none;"
        ></canvas>


        <!-- Captured Image -->

        <img
          id="capturedImage"
          alt="Captured customer image"
        >


        <!-- Buttons -->

        <div class="button-group">


          <button
            id="startCameraBtn"
            class="tryon-btn primary-btn"
          >
            📷 Start Camera
          </button>


          <button
            id="captureBtn"
            class="tryon-btn primary-btn"
            style="display:none;"
          >
            📸 Capture
          </button>


          <button
            id="retakeBtn"
            class="tryon-btn secondary-btn"
            style="display:none;"
          >
            🔄 Retake
          </button>


          <button
            id="stopCameraBtn"
            class="tryon-btn danger-btn"
            style="display:none;"
          >
            ⏹ Stop Camera
          </button>


          <!-- Upload -->

          <label
            for="imageInput"
            class="upload-label"
          >
            📁 Upload Photo
          </label>


          <input
            type="file"
            id="imageInput"
            accept="image/*"
          >


        </div>


        <!-- Status -->

        <div
          id="status"
          class="status"
        >
          Choose camera or upload a photo.
        </div>


      </div>


      <!-- Customer Image Ready -->

      <div
        id="nextSection"
        class="next-section"
      >

        <h2>
          Customer Image Ready ✓
        </h2>


        <p>
          Your image is ready for clothing selection.
        </p>


        <button
          id="continueBtn"
          class="tryon-btn primary-btn"
        >
          Continue to Clothing Selection →
        </button>

      </div>


    </div>


    <!-- =======================================
         RIGHT PANEL - SELECT CLOTHING
         ======================================= -->

    <div class="clothing-panel">


      <h2>
        Select Clothing
      </h2>


      <p id="categoryMessage">
        Loading categories...
      </p>


      <!-- Categories -->

      <div id="categoryButtons"></div>


      <!-- Products -->

      <div id="productList"></div>

<!-- =========================================
     VIRTUAL TRY-ON RESULT
     ========================================= -->

<div id="tryonResultSection" style="display:none; margin-top:30px; padding-top:25px; border-top:1px solid #ddd;">

  <h2 style="text-align:center;">
    Virtual Try-On Result
  </h2>

  <p id="tryonResultStatus" style="text-align:center; color:#555;">
    Your result will appear here.
  </p>

  <div style="text-align:center; margin-top:20px;">

    <img
      id="tryonResultImage"
      alt="Virtual Try-On Result"
      style="
        display:none;
        width:100%;
        max-width:500px;
        border-radius:12px;
        margin:auto;
      "
    >

  </div>

</div>
    </div>


  </div>


  <!-- =========================================
       CAMERA JAVASCRIPT
       ========================================= -->

  <script>


    const video =
      document.getElementById("cameraVideo");


    const canvas =
      document.getElementById("cameraCanvas");


    const capturedImage =
      document.getElementById("capturedImage");


    const startCameraBtn =
      document.getElementById("startCameraBtn");


    const captureBtn =
      document.getElementById("captureBtn");


    const retakeBtn =
      document.getElementById("retakeBtn");


    const stopCameraBtn =
      document.getElementById("stopCameraBtn");


    const imageInput =
      document.getElementById("imageInput");


    const status =
      document.getElementById("status");


    const nextSection =
      document.getElementById("nextSection");


    const continueBtn =
      document.getElementById("continueBtn");


    let cameraStream = null;

    let customerImageData = null;



    /* =========================================
       START CAMERA
       ========================================= */

    startCameraBtn.addEventListener(
      "click",
      async () => {

        try {

          cameraStream =
            await navigator.mediaDevices.getUserMedia({

              video: {
                facingMode: "user"
              },

              audio: false

            });


          video.srcObject =
            cameraStream;


          video.style.display =
            "block";


          capturedImage.style.display =
            "none";


          startCameraBtn.style.display =
            "none";


          captureBtn.style.display =
            "inline-block";


          stopCameraBtn.style.display =
            "inline-block";


          retakeBtn.style.display =
            "none";


          nextSection.style.display =
            "none";


          status.textContent =
            "Camera active. Position yourself clearly and capture.";


        } catch (error) {

          console.error(error);


          status.textContent =
            "Camera access was denied or is unavailable. You can upload a photo instead.";

        }

      }
    );



    /* =========================================
       CAPTURE PHOTO
       ========================================= */

    captureBtn.addEventListener(
      "click",
      () => {

        if (!cameraStream) return;


        canvas.width =
          video.videoWidth;


        canvas.height =
          video.videoHeight;


        const context =
          canvas.getContext("2d");


        // Undo mirrored preview

        context.translate(
          canvas.width,
          0
        );


        context.scale(
          -1,
          1
        );


        context.drawImage(
          video,
          0,
          0,
          canvas.width,
          canvas.height
        );


        customerImageData =
          canvas.toDataURL(
            "image/jpeg",
            0.92
          );


        capturedImage.src =
          customerImageData;


        capturedImage.style.display =
          "block";


        video.style.display =
          "none";


        captureBtn.style.display =
          "none";


        retakeBtn.style.display =
          "inline-block";


        status.textContent =
          "Photo captured successfully.";


        nextSection.style.display =
          "block";

      }
    );



    /* =========================================
       RETAKE
       ========================================= */

    retakeBtn.addEventListener(
      "click",
      () => {

        capturedImage.style.display =
          "none";


        video.style.display =
          "block";


        captureBtn.style.display =
          "inline-block";


        retakeBtn.style.display =
          "none";


        nextSection.style.display =
          "none";


        status.textContent =
          "Camera active. Capture another photo.";

      }
    );



    /* =========================================
       STOP CAMERA
       ========================================= */

    stopCameraBtn.addEventListener(
      "click",
      stopCamera
    );


    function stopCamera() {

      if (cameraStream) {

        cameraStream
          .getTracks()
          .forEach(
            track => track.stop()
          );


        cameraStream = null;

      }


      video.srcObject =
        null;


      video.style.display =
        "none";


      startCameraBtn.style.display =
        "inline-block";


      captureBtn.style.display =
        "none";


      stopCameraBtn.style.display =
        "none";


      status.textContent =
        "Camera stopped. You can upload a photo or start again.";

    }



    /* =========================================
       UPLOAD IMAGE
       ========================================= */

    imageInput.addEventListener(
      "change",
      (event) => {

        const file =
          event.target.files[0];


        if (!file) return;


        if (!file.type.startsWith("image/")) {

          status.textContent =
            "Please select an image file.";

          return;

        }


        const reader =
          new FileReader();


        reader.onload =
          function (e) {

            customerImageData =
              e.target.result;


            capturedImage.src =
              customerImageData;


            capturedImage.style.display =
              "block";


            video.style.display =
              "none";


            captureBtn.style.display =
              "none";


            retakeBtn.style.display =
              "inline-block";


            stopCamera();


            status.textContent =
              "Photo uploaded successfully.";


            nextSection.style.display =
              "block";

          };


        reader.readAsDataURL(file);

      }
    );



    /* =========================================
       CONTINUE
       ========================================= */

    continueBtn.addEventListener(
      "click",
      () => {

        if (!customerImageData) {

          status.textContent =
            "Please capture or upload a customer image first.";

          return;

        }


        sessionStorage.setItem(
          "styleiq_customer_image",
          customerImageData
        );


        alert(
          "Customer image saved. Select a clothing product from the right panel."
        );

      }
    );



    /* =========================================
       CLEANUP
       ========================================= */

    window.addEventListener(
      "beforeunload",
      () => {

        stopCamera();

      }
    );

  </script>



  <!-- =========================================
       FIREBASE + PRODUCT SELECTION
       ========================================= -->

  <script type="module">


    import {
      auth,
      db
    }
    from "./js/firebase-config.js";


    import {
      onAuthStateChanged
    }
    from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


    import {
      collection,
      query,
      where,
      getDocs
    }
    from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";



    const categoryMessage =
      document.getElementById(
        "categoryMessage"
      );


    const categoryButtons =
      document.getElementById(
        "categoryButtons"
      );


    const productList =
      document.getElementById(
        "productList"
      );


    let currentUser = null;

    let sellerProducts = [];



    /* =========================================
       CHECK SELLER LOGIN
       ========================================= */

    onAuthStateChanged(
      auth,
      async (user) => {

        if (!user) {

          window.location.href =
            "login.html";

          return;

        }


        currentUser =
          user;


        await loadSellerProducts();

      }
    );



    /* =========================================
       LOAD SELLER PRODUCTS
       ========================================= */

    async function loadSellerProducts() {

      try {

        categoryMessage.textContent =
          "Loading your products...";


        const clothingRef =
          collection(
            db,
            "clothing"
          );


        const clothingQuery =
          query(
            clothingRef,
            where(
              "sellerId",
              "==",
              currentUser.uid
            )
          );


        const snapshot =
          await getDocs(
            clothingQuery
          );


        sellerProducts = [];


        snapshot.forEach(
          (doc) => {

            sellerProducts.push({

              id: doc.id,

              ...doc.data()

            });

          }
        );



        if (
          sellerProducts.length === 0
        ) {

          categoryMessage.textContent =
            "You don't have any products yet.";

          return;

        }


        showCategories();


      } catch (error) {

        console.error(
          "Error loading seller products:",
          error
        );


        categoryMessage.textContent =
          "Unable to load your products.";

      }

    }



    /* =========================================
       SHOW CATEGORIES
       ========================================= */

    function showCategories() {

      categoryButtons.innerHTML =
        "";


      productList.innerHTML =
        "";


      const categories =
        [
          ...new Set(
            sellerProducts
              .map(
                product =>
                  product.category
              )
              .filter(Boolean)
          )
        ];



      categoryMessage.textContent =
        "Select a category:";



      categories.forEach(
        (category) => {

          const button =
            document.createElement(
              "button"
            );


          button.textContent =
            category;


          button.type =
            "button";


          button.addEventListener(
            "click",
            () =>
              showProducts(category)
          );


          categoryButtons.appendChild(
            button
          );

        }
      );

    }



    /* =========================================
       SHOW PRODUCTS
       ========================================= */

    function showProducts(
      category
    ) {

      productList.innerHTML =
        "";


      const products =
        sellerProducts.filter(
          product =>
            product.category ===
            category
        );



      products.forEach(
        (product) => {

          const card =
            document.createElement(
              "div"
            );


          card.className =
            "tryon-product-card";



          card.innerHTML = `

            <img
              src="${product.imageUrl}"
              alt="${product.name}"
            >

            <h3>
              ${product.name}
            </h3>

            <p>
              ₹${product.price}
            </p>

            <p>
              Color:
              ${product.color || "Not specified"}
            </p>

            <p>
              Material:
              ${product.material || "Not specified"}
            </p>

            <p>
              Available sizes:
              ${
                product.sizes
                  ? product.sizes.join(", ")
                  : "Not specified"
              }
            </p>

            <button
              type="button"
              class="select-product-btn"
              data-product-id="${product.id}"
            >
              Select This Product
            </button>

          `;


          productList.appendChild(
            card
          );

        }
      );



      /* =======================================
         PRODUCT SELECTION
         ======================================= */

      document
        .querySelectorAll(
          ".select-product-btn"
        )
        .forEach(
          (button) => {

            button.addEventListener(
              "click",
              () => {

                const productId =
                  button.dataset.productId;


                const selectedProduct =
                  sellerProducts.find(
                    product =>
                      product.id ===
                      productId
                  );


                if (
                  selectedProduct
                ) {

                  sessionStorage.setItem(
                    "styleiq_selected_product",
                    JSON.stringify(
                      selectedProduct
                    )
                  );


                  alert(
                    `${selectedProduct.name} selected for Virtual Try-On`
                  );
                  const tryonResultSection =
  document.getElementById("tryonResultSection");

const tryonResultStatus =
  document.getElementById("tryonResultStatus");

tryonResultSection.style.display = "block";

tryonResultStatus.textContent =
  "Product selected. Ready for Virtual Try-On.";

                }

              }
            );

          }
        );

    }

  </script>


</body>

</html>
