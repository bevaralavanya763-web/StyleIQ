<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="StyleIQ Seller Login">

    <title>Seller Login | StyleIQ</title>

    <link rel="stylesheet"
          href="css/style.css">
</head>

<body>

    <!-- Navigation -->
    <header class="navbar">

        <a href="index.html"
           class="logo">
            Style<span>IQ</span>
        </a>

        <nav class="navbar-links">

            <a href="register.html"
               class="nav-button">
                Register
            </a>

        </nav>

    </header>


    <!-- Login -->
    <main>

        <section class="auth-section">

            <div class="auth-card">

                <div class="auth-logo">

                    <img
                        src="images/styleiq-logo.png"
                        alt="StyleIQ logo">

                </div>


                <p class="auth-eyebrow">
                    SELLER ACCOUNT
                </p>


                <h1>
                    Welcome
                    <span>back.</span>
                </h1>


                <p class="auth-subtitle">
                    Sign in to manage your clothing
                    collection and StyleIQ catalog.
                </p>


                <!-- Login Form -->

                <form id="loginForm">

                    <div class="form-group">

                        <label for="email">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            placeholder="Enter your email"
                            required>

                    </div>


                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            required>

                    </div>


                    <button
                        type="submit"
                        id="loginButton"
                        class="auth-button">

                        Login

                    </button>


                    <p
                        id="loginMessage"
                        class="auth-message">
                    </p>

                </form>


                <div class="auth-footer">

                    <span>
                        Don't have an account?
                    </span>

                    <a href="register.html">
                        Create a seller account
                    </a>

                </div>

            </div>

        </section>

    </main>


    <!-- Footer -->
    <footer class="footer">

        <p>
            © 2026 StyleIQ. All rights reserved.
        </p>

    </footer>


    <!-- Firebase Login -->
    <script
        type="module"
        src="js/login.js">
    </script>

</body>

</html>
