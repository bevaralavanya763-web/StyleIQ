<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="StyleIQ Seller Login">

    <title>StyleIQ | Seller Login</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        /* Authentication page */

        .auth-page {
            min-height: calc(100vh - 132px);

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 50px 20px;
        }

        .auth-card {
            width: 100%;
            max-width: 450px;

            background: #ffffff;

            padding: 40px;

            border: 1px solid #e6e6e6;
            border-radius: 16px;

            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.07);
        }

        .auth-card h1 {
            margin-bottom: 8px;

            font-size: 30px;
        }

        .auth-subtitle {
            margin-bottom: 30px;

            color: #666666;

            font-size: 15px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;

            margin-bottom: 7px;

            font-size: 14px;
            font-weight: 700;
        }

        .form-group input {
            width: 100%;

            padding: 13px 14px;

            border: 1px solid #dcdcdc;
            border-radius: 8px;

            font-size: 15px;

            outline: none;

            transition: border-color 0.2s ease;
        }

        .form-group input:focus {
            border-color: #6c4df6;
        }

        .auth-button {
            width: 100%;

            padding: 14px;

            border: none;
            border-radius: 8px;

            background: #6c4df6;

            color: #ffffff;

            font-size: 15px;
            font-weight: 700;

            cursor: pointer;

            transition: background 0.2s ease;
        }

        .auth-button:hover {
            background: #5638d9;
        }

        .auth-button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .form-message {
            min-height: 20px;

            margin-top: 15px;

            font-size: 14px;
            text-align: center;
        }

        .register-link {
            margin-top: 25px;

            text-align: center;

            color: #666666;

            font-size: 14px;
        }

        .register-link a {
            color: #6c4df6;

            font-weight: 700;

            text-decoration: none;
        }
    </style>
</head>

<body>

    <!-- Navigation -->
    <header class="navbar">

        <a href="index.html" class="logo">
            Style<span>IQ</span>
        </a>

        <nav class="navbar-links">

            <a href="register.html">
                Register
            </a>

        </nav>

    </header>


    <!-- Login -->
    <main class="auth-page">

        <section class="auth-card">

            <p class="eyebrow">
                SELLER ACCOUNT
            </p>

            <h1>
                Welcome back
            </h1>

            <p class="auth-subtitle">
                Login to manage your StyleIQ clothing catalog.
            </p>


            <form id="loginForm">

                <!-- Email -->
                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="seller@example.com"
                        autocomplete="email"
                        required
                    >

                </div>


                <!-- Password -->
                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <!-- Submit -->
                <button
                    type="submit"
                    id="loginButton"
                    class="auth-button">

                    Login

                </button>


                <!-- Message -->
                <p
                    id="loginMessage"
                    class="form-message"
                    aria-live="polite">
                </p>

            </form>


            <p class="register-link">

                Don't have an account?

                <a href="register.html">
                    Create a seller account
                </a>

            </p>

        </section>

    </main>


    <!-- Footer -->
    <footer class="footer">

        <p>
            © 2026 StyleIQ. All rights reserved.
        </p>

    </footer>
    <script type="module" src="js/login.js"></script>

</body>

</html>
