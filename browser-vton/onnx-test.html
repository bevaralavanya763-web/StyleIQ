<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>StyleIQ ONNX Diagnostic</title>
</head>

<body>

<h1>StyleIQ ONNX Diagnostic</h1>

<div id="status">1. Loading ONNX Runtime...</div>

<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.webgpu.min.js"></script>

<script>

async function test() {

    const status = document.getElementById("status");

    try {

        status.innerHTML += "<br>2. ONNX Runtime loaded.";

        if (!navigator.gpu) {
            throw new Error("WebGPU is not available.");
        }

        status.innerHTML += "<br>3. WebGPU detected.";

        const adapter = await navigator.gpu.requestAdapter();

        if (!adapter) {
            throw new Error("WebGPU adapter unavailable.");
        }

        status.innerHTML += "<br>4. WebGPU adapter obtained.";

        const session =
            await ort.InferenceSession.create(
                "./styleiq-test.onnx",
                {
                    executionProviders: ["webgpu"]
                }
            );

        status.innerHTML +=
            "<br>5. ONNX model loaded.";

        const input = new ort.Tensor(
            "float32",
            new Float32Array([5]),
            [1]
        );

        const results = await session.run({
            X: input
        });

        status.innerHTML +=
            "<br>6. Model executed.";

        status.innerHTML +=
            "<br><br>✅ RESULT: " +
            results.Y.data[0];

    } catch (error) {

        status.innerHTML +=
            "<br><br>❌ ERROR: " +
            error.message;

        console.error(error);
    }

}

test();

</script>

</body>
</html>
