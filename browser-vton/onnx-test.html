<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>StyleIQ ONNX WebGPU Test</title>
</head>

<body>

<h1>StyleIQ ONNX + WebGPU Test</h1>

<div id="status">Loading...</div>

<script type="module">

import * as ort from
    "https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/esm/ort.webgpu.min.mjs";

const status = document.getElementById("status");

async function test() {

    try {

        if (!navigator.gpu) {
            throw new Error("WebGPU is not supported");
        }

        const adapter = await navigator.gpu.requestAdapter();

        if (!adapter) {
            throw new Error("WebGPU adapter unavailable");
        }

        const session = await ort.InferenceSession.create(
            "./styleiq-test.onnx",
            {
                executionProviders: ["webgpu"]
            }
        );

        const input = new ort.Tensor(
            "float32",
            new Float32Array([5]),
            [1]
        );

        const results = await session.run({
            X: input
        });

        const output = results.Y.data[0];

        status.innerHTML =
            "✅ ONNX + WebGPU is working!<br><br>" +
            "Input: 5<br>" +
            "Output: " + output;

    } catch (error) {

        status.innerHTML =
            "❌ Test failed:<br><br>" +
            error.message;

        console.error(error);
    }
}

test();

</script>

</body>
</html>
