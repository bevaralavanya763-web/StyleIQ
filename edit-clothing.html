<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Edit StyleIQ Clothing Product">

    <title>Edit Clothing | StyleIQ</title>

    <link rel="stylesheet" href="css/style.css?v=5">
</head>

<body>

    <!-- NAVBAR -->

    <header class="navbar">

        <a href="index.html" class="logo">
            Style<span>IQ</span>
        </a>

        <nav class="navbar-links">

            <a href="dashboard.html">
                Dashboard
            </a>

            <a href="catalog.html">
                Catalog
            </a>

        </nav>

    </header>


    <!-- EDIT PRODUCT -->

    <main>

        <section class="edit-product-section">

            <div class="edit-product-header">

                <p class="edit-product-eyebrow">
                    PRODUCT MANAGEMENT
                </p>

                <h1>
                    Edit your <span>garment.</span>
                </h1>

                <p class="edit-product-description">
                    Update the details of your clothing product
                    and save your changes to the StyleIQ catalog.
                </p>

            </div>


            <!-- FORM -->

            <div class="product-form-card">

                <form id="editClothingForm">


                    <!-- PRODUCT NAME -->

                    <div class="form-group">

                        <label for="editProductName">
                            Clothing Name
                        </label>

                        <input
                            type="text"
                            id="editProductName"
                            placeholder="e.g. Classic Cotton Shirt"
                            required>

                    </div>


                    <!-- CATEGORY -->

                    <div class="form-group">

                        <label for="editCategory">
                            Category
                        </label>

                        <select
                            id="editCategory"
                            required>

                            <option value="">
                                Select category
                            </option>

                            <option value="Shirts">
                                Shirts
                            </option>

                            <option value="T-Shirts">
                                T-Shirts
                            </option>

                            <option value="Jeans">
                                Jeans
                            </option>

                            <option value="Trousers">
                                Trousers
                            </option>

                            <option value="Dresses">
                                Dresses
                            </option>

                            <option value="Jackets">
                                Jackets
                            </option>

                            <option value="Sarees">
                                Sarees
                            </option>

                            <option value="Kurtas">
                                Kurtas
                            </option>

                            <option value="Hoodies">
                                Hoodies
                            </option>

                            <option value="Other">
                                Other
                            </option>

                        </select>

                    </div>


                    <!-- PRICE -->

                    <div class="form-group">

                        <label for="editPrice">
                            Price (₹)
                        </label>

                        <input
                            type="number"
                            id="editPrice"
                            min="0"
                            step="0.01"
                            placeholder="e.g. 799"
                            required>

                    </div>


                    <!-- COLOR -->

                    <div class="form-group">

                        <label for="editColor">
                            Color
                        </label>

                        <input
                            type="text"
                            id="editColor"
                            placeholder="e.g. Black"
                            required>

                    </div>


                    <!-- MATERIAL -->

                    <div class="form-group">

                        <label for="editMaterial">
                            Material
                        </label>

                        <input
                            type="text"
                            id="editMaterial"
                            placeholder="e.g. Cotton"
                            required>

                    </div>


                    <!-- SIZES -->

                    <div class="form-group">

                        <label>
                            Available Sizes
                        </label>

                        <div class="size-options">

                            <label class="size-option">
                                <input
                                    type="checkbox"
                                    name="editSizes"
                                    value="XS">
                                <span>XS</span>
                            </label>

                            <label class="size-option">
                                <input
                                    type="checkbox"
                                    name="editSizes"
                                    value="S">
                                <span>S</span>
                            </label>

                            <label class="size-option">
                                <input
                                    type="checkbox"
                                    name="editSizes"
                                    value="M">
                                <span>M</span>
                            </label>

                            <label class="size-option">
                                <input
                                    type="checkbox"
                                    name="editSizes"
                                    value="L">
                                <span>L</span>
                            </label>

                            <label class="size-option">
                                <input
                                    type="checkbox"
                                    name="editSizes"
                                    value="XL">
                                <span>XL</span>
                            </label>

                            <label class="size-option">
                                <input
                                    type="checkbox"
                                    name="editSizes"
                                    value="XXL">
                                <span>XXL</span>
                            </label>

                        </div>

                    </div>


                    <!-- IMAGE NOTE -->

                    <div class="image-upload-note">

                        <strong>Product Image</strong>

                        <p>
                            Image editing will be connected
                            when Firebase Storage is added.
                        </p>

                    </div>


                    <!-- BUTTON -->

                    <button
                        type="submit"
                        id="updateProductButton"
                        class="primary-button">

                        Update Product

                    </button>


                    <!-- MESSAGE -->

                    <p
                        id="editProductMessage"
                        class="auth-message">
                    </p>

                </form>

            </div>

        </section>

    </main>


    <!-- FOOTER -->

    <footer class="footer">

        <p>
            © 2026 StyleIQ. All rights reserved.
        </p>

    </footer>


    <!-- JAVASCRIPT -->

    <script
        type="module"
        src="js/edit-clothing.js">
    </script>

</body>

</html>
