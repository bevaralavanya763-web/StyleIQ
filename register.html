<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="StyleIQ Seller Registration">

    <title>Create Account | StyleIQ</title>

    <link rel="stylesheet"
          href="css/style.css">
</head>

<body>

    <!-- Navigation -->
    <header class="navbar">

        <a href="index.html"
           class="logo">
            Style<span>IQ</span>
        </a>

        <nav class="navbar-links">

            <a href="login.html">
                Seller Login
            </a>

        </nav>

    </header>


    <!-- Registration -->
    <main>

        <section class="auth-section">

            <div class="auth-card">

                <div class="auth-logo">

                    <img
                        src="images/styleiq-logo.png"
                        alt="StyleIQ logo">

                </div>


                <p class="auth-eyebrow">
                    SELLER ACCOUNT
                </p>


                <h1>
                    Create your
                    <span>StyleIQ account.</span>
                </h1>


                <p class="auth-subtitle">
                    Set up your seller profile and bring
                    your clothing collection into the
                    StyleIQ catalog.
                </p>


                <!-- Registration Form -->

                <form id="registerForm">

                    <div class="form-group">

                        <label for="sellerName">
                            Seller Name
                        </label>

                        <input
                            type="text"
                            id="sellerName"
                            placeholder="Enter your name"
                            required>

                    </div>


                    <div class="form-group">

                        <label for="email">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            placeholder="Enter your email"
                            required>

                    </div>


                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            placeholder="Create a password"
                            required>

                    </div>


                    <button
                        type="submit"
                        id="registerButton"
                        class="auth-button">

                        Create Seller Account

                    </button>


                    <p
                        id="registerMessage"
                        class="auth-message">
                    </p>

                </form>


                <div class="auth-footer">

                    <span>
                        Already have an account?
                    </span>

                    <a href="login.html">
                        Sign in
                    </a>

                </div>

            </div>

        </section>

    </main>


    <!-- Footer -->
    <footer class="footer">

        <p>
            © 2026 StyleIQ. All rights reserved.
        </p>

    </footer>


    <!-- Firebase Registration -->
    <script
        type="module"
        src="js/register.js">
    </script>

</body>

</html>
