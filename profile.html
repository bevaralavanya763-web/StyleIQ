<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="StyleIQ Seller Profile">

    <title>Seller Profile | StyleIQ</title>

    <link rel="stylesheet" href="css/style.css?v=6">
</head>

<body>

    <!-- NAVBAR -->

    <header class="navbar">

        <a href="index.html" class="logo">
            Style<span>IQ</span>
        </a>

        <nav class="navbar-links">

            <a href="dashboard.html">
                Dashboard
            </a>

            <a href="catalog.html">
                Catalog
            </a>

        </nav>

    </header>


    <!-- SELLER PROFILE -->

    <main>

        <section class="profile-section">

            <div class="profile-header">

                <p class="profile-eyebrow">
                    SELLER ACCOUNT
                </p>

                <h1>
                    Your <span>profile.</span>
                </h1>

                <p class="profile-subtitle">
                    View the account information connected
                    to your StyleIQ seller account.
                </p>

            </div>


            <!-- PROFILE CARD -->

            <div class="profile-card">

                <div class="profile-avatar">
                    S
                </div>


                <div class="profile-information">

                    <div class="profile-field">

                        <span>
                            SELLER NAME
                        </span>

                        <strong id="sellerName">
                            Loading...
                        </strong>

                    </div>


                    <div class="profile-field">

                        <span>
                            EMAIL ADDRESS
                        </span>

                        <strong id="sellerEmail">
                            Loading...
                        </strong>

                    </div>


                    <div class="profile-field">

                        <span>
                            SELLER ID
                        </span>

                        <strong id="sellerId">
                            Loading...
                        </strong>

                    </div>


                    <div class="profile-field">

                        <span>
                            ACCOUNT CREATED
                        </span>

                        <strong id="createdAt">
                            Loading...
                        </strong>

                    </div>

                </div>


                <div class="profile-actions">

                    <a href="dashboard.html"
                       class="secondary-button">
                        Back to Dashboard
                    </a>

                    <a href="catalog.html"
                       class="primary-button">
                        View My Catalog
                    </a>

                </div>

                <p id="profileMessage"
                   class="auth-message">
                </p>

            </div>

        </section>

    </main>


    <!-- FOOTER -->

    <footer class="footer">

        <p>
            © 2026 StyleIQ. All rights reserved.
        </p>

    </footer>


    <!-- JAVASCRIPT -->

    <script
        type="module"
        src="js/profile.js">
    </script>

</body>

</html>
